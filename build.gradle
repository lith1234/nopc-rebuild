plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}
version = mod_version
group = 'com.nopcnotrade'
base { archivesName = 'nopcnotrade' }

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "nopcnotrade.refmap.json"
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    annotationProcessor "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
